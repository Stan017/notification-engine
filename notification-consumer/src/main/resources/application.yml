spring:
  application:
    name: notification-consumer
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ml.notification.common.dto"
        spring.json.value.default.type: com.ml.notification.common.dto.DomainEvent
    listener:
      ack-mode: manual_immediate
  datasource:
    url: jdbc:postgresql://localhost:5433/notifications
    username: mluser
    password: mlpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

kafka:
  topics:
    orders: ml.orders.events
    payments: ml.payments.events
    shipments: ml.shipments.events
    dlq: ml.notifications.dlq

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
